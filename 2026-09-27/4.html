<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>公式格式化示例</title>
    <style>
        .ans-block {
            margin: 20px;
            /*text-align: center;*/
            font-size: 2em;
        }
        .blue-block {
            color: blue;
        }
    </style>
</head>
<body>
<div class="ans-block blue-block">
    ax<sup style="color: red;">2</sup>+bx+c=0
</div>
<div class="ans-block blue-block">
    X<sub>1</sub><sup>2</sup>+X<sub>2</sub><sup>2</sup>=Y<sup>2</sup>
</div>
<div class="ans-block">
    <b style="color: blue">Web（加粗）</b>
    <i style="color: red">程序（倾斜）</i>
    <u style="color: green">设计（下划线）</u>
</div>
</body>
</html>

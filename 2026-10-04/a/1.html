<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>2.1 标记&lt;font&gt;的使用</title>
    <style>
        .outer-container {
            border: black solid 1px;
            width: fit-content;
            padding: 4px;
        }
        h1 {
            text-indent: 50px;
            margin-top: 0;
        }
    </style>
</head>
<body>
<div class="outer-container">
    <h1>2.1 标记&lt;font&gt;的使用</h1>
    <p>该标记设置颜色的格式如下：</p>
    <p><b>&lt;font color=颜色&gt;文本&lt;/font&gt;</b></p>
    <p>例如：</p>
    <p>&lt;font color=red&gt;红色文本&lt;/font&gt; 的结果如下：</p>
    <font color="red">红色文本</font>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>第二章 HTML基础</title>
    <style>
        h1 {
            text-align: center;
            font-family: "黑体", serif;
            color: red;
        }
        h2 {
            font-family: "楷体", serif;
            color: green;
        }
        p {
            text-indent: 30px;
            font-family: "宋体", serif;
            color: blue;
        }
    </style>
</head>
<body>
<h1>第二章  HTML 基础</h1>
<h2>2.1 HTML 文档的结构</h2>
<p>HTML 标签告诉浏览器 HTML 文件的开始和结束,HTML 文档中所有的内容都在这两个
标签之间。</p>
<p>头部标签放置页面的标题以及文件信息等内容,这两个标签之间的内容统称作 HTML 的
头部，位于头部的内容都不会在网页上直接显示。</p>
<p>主体标签放置绝大多数 HTML 的内容。</p>
</body>
</html>

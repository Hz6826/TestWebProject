<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>┽→那些哖のmarquee，巳經老到呮剩丅滾動の眼淚，莪們嘟老ㄋ﹏</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            font-family: "宋体", "SimSun", "MS Song", monospace;
        }

        marquee {
            width: 600px;
            max-width: 90%;
            padding: 15px 10px;
            border: 2px dashed #00ff00;
            background-color: #000;
            color: #00ff00;
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>
<marquee behavior="alternate" direction="left" scrollamount="4" scrolldelay="50">
    ╰☆╮那年夏天，莪們在QQ空間裏相遇，伱說會陪莪看埖開埖落；後來的後來，莪們嘟赱散ㄋ，呮剩丅這個古老のmarquee，還在屏幕裏一矗滾動，像涐們囬不去的青春，像眼淚壹樣，滾啊滾，滾到迗涯海角，滾到莪再也想不起伱の模樣……☆╮
</marquee>
</body>
</html>

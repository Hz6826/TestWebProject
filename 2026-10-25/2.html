<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人信息</title>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById("mainForm").addEventListener("submit", (evt) => {
                evt.preventDefault();
                if (document.getElementById("studentId").value.trim().length !== 10) {
                    alert("学号长度应为10位");
                    return;
                }
                document.getElementById("hint").textContent = "表单已成功提交！";
            })
        });
    </script>
</head>
<body>
<h1>个人信息</h1>
<form id="mainForm">
    <label for="studentId">学号</label>
    <input type="text" id="studentId" name="studentId" required/><br>
    <label for="name">姓名</label>
    <input type="text" id="name" name="name" required/><br>
    <label for="major">专业</label>
    <input type="text" id="major" name="major" required/><br>
    <input type="submit" id="submitBtn" value="提交"/>
    <input type="reset" id="resetBtn" value="清空"/>
</form>
<p id="hint" style="color: green"></p>
</body>
</html>

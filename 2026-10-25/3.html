<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>求最大值和最小值</title>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById("mainForm").addEventListener("submit", (evt) => {
                evt.preventDefault();
                document.getElementById("maxNum").value =
                    Math.max(document.getElementById("firstNum").value, document.getElementById("secondNum").value);
                document.getElementById("minNum").value =
                    Math.min(document.getElementById("firstNum").value, document.getElementById("secondNum").value);
            })
        });
    </script>
</head>
<body>
<h1>求最大值和最小值</h1>
<form id="mainForm">
    <label for="firstNum">第一个数</label>
    <input type="text" id="firstNum" name="firstNum" required/><br>
    <label for="secondNum">第二个数</label>
    <input type="text" id="secondNum" name="secondNum" required/><br>
    <label for="maxNum">最大值</label>
    <input type="text" id="maxNum" name="maxNum" readonly/><br>
    <label for="minNum">最小值</label>
    <input type="text" id="minNum" name="minNum" readonly/><br>
    <input type="submit" id="submitBtn" value="开始"/>
    <input type="reset" id="resetBtn" value="清空"/>
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>字符串复制</title>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById("mainForm").addEventListener("submit", (evt) => {
                evt.preventDefault();
                document.getElementById("repeat").value =
                    document.getElementById("inputText").value;
            })
        });
    </script>
</head>
<body>
<h1>字符串复制</h1>
<form id="mainForm">
    <label for="inputText">输入</label>
    <input type="text" id="inputText" name="inputText" required/><br>
    <label for="repeat">重复</label>
    <input type="text" id="repeat" name="repeat" readonly/><br>
    <input type="submit" id="submitBtn" value="开始"/>
    <input type="reset" id="resetBtn" value="清空"/>
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>显示图案</title>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let result = "";

            for (let i = 1; i <= 9; i++) {
                for (let j = 0; j < i; j++) {
                    result += "*";
                }
                if (i !== 9) result += "\n";
            }

            document.getElementById("mainContent").textContent = result;
        });
    </script>
</head>
<body>
<pre><code id="mainContent"></code></pre>
</body>
</html>
